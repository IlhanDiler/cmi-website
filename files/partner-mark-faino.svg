<svg xmlns="http://www.w3.org/2000/svg" width="360" height="140" viewBox="0 0 360 140" role="img" aria-labelledby="title desc">
  <title id="title">FAINO logo</title>
  <desc id="desc">Warm cream logo with the Cyrillic word ФАЙНО and an ornamental floral band.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcf4df"/>
      <stop offset="1" stop-color="#f2e1c0"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfc492"/>
      <stop offset="1" stop-color="#b48b58"/>
    </linearGradient>
    <g id="motif">
      <circle cx="0" cy="0" r="4.2" fill="#b44c4d"/>
      <ellipse cx="-7" cy="-5" rx="6.8" ry="3.2" fill="#758c55" transform="rotate(-28 -7 -5)"/>
      <ellipse cx="7" cy="-4" rx="6.3" ry="3" fill="#c58a59" transform="rotate(28 7 -4)"/>
      <circle cx="0" cy="-8.2" r="1.9" fill="#e6c87d"/>
    </g>
  </defs>

  <rect x="3" y="3" width="354" height="134" rx="18" fill="url(#paper)" stroke="url(#border)" stroke-width="2.2"/>
  <path d="M18 112 C42 97, 66 97, 90 112 S138 127, 162 112 S210 97, 234 112 S282 127, 306 112 S330 97, 342 104" fill="none" stroke="#9b7a51" stroke-width="2" opacity="0.55"/>

  <text x="24" y="55" fill="#b34747" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="1.5">ФАЙНО</text>
  <text x="26" y="80" fill="#8f6c49" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">український вокальний ансамбль</text>

  <use href="#motif" x="34" y="118"/>
  <use href="#motif" x="72" y="117"/>
  <use href="#motif" x="110" y="118"/>
  <use href="#motif" x="148" y="117"/>
  <use href="#motif" x="186" y="118"/>
  <use href="#motif" x="224" y="117"/>
  <use href="#motif" x="262" y="118"/>
  <use href="#motif" x="300" y="117"/>
  <use href="#motif" x="334" y="118"/>
</svg>