<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Focus Check</title>
  <link rel="stylesheet" href="../../style.css?v=20260406-cachefix-1">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: linear-gradient(180deg, #eef6f5 0%, #dbeaea 100%);
    }

    .qa-shell {
      display: grid;
      gap: 24px;
      max-width: 960px;
      margin: 0 auto;
    }

    .qa-panel {
      padding: 20px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(18, 62, 70, 0.08);
    }

    .qa-panel--dark {
      background: rgba(9, 21, 28, 0.9);
      border-color: rgba(235, 246, 243, 0.14);
    }

    .qa-mobile-menu {
      position: static;
      max-height: none;
      min-height: 0;
      opacity: 1;
      padding: 16px 0 10px;
      pointer-events: auto;
      overflow: visible;
    }

    .qa-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .qa-logo-badge,
    .qa-menu-glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font-family: "Sora", sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .qa-logo-badge {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(16, 52, 60, 0.12);
      color: #10343c;
      font-size: 0.72rem;
    }

    .qa-menu-glyph {
      width: 18px;
      height: 18px;
      color: #ffffff;
      font-size: 0.92rem;
      line-height: 1;
    }

    .qa-force-focus.subpage-topbar__brand,
    .qa-force-focus.nav-brand-link {
      box-shadow: var(--focus-ring-soft);
    }

    .qa-force-focus.mobile-menu-btn {
      background: rgba(127, 232, 219, 0.16);
      border-color: rgba(127, 232, 219, 0.3);
      box-shadow: var(--focus-ring-soft);
    }

    .qa-force-focus.mobile-nav-link {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      border-bottom-color: transparent;
      border-radius: 16px;
      box-shadow: var(--focus-ring-soft);
    }

    .qa-force-focus.lang-switch-button {
      background: var(--lang-button-hover-bg);
      border-color: var(--lang-button-hover-border-color);
      box-shadow: var(--focus-ring-soft);
    }
  </style>
</head>
<body class="subpage-body subpage-body--privacy">
  <div class="qa-shell">
    <div class="qa-panel">
      <div class="qa-row">
        <a id="focusBrand" class="subpage-topbar__brand" href="#">
          <span class="qa-logo-badge" aria-hidden="true">CMI</span>
          <span class="subpage-topbar__brand-text">
            <span class="subpage-topbar__brand-title">CMI Ochsenfurt</span>
            <span class="subpage-topbar__brand-subtitle">Musik baut Brücken</span>
          </span>
        </a>
        <a class="subpage-topbar__link" href="#">Startseite</a>
        <a class="subpage-topbar__link" href="#" aria-current="page">Datenschutz</a>
      </div>
    </div>

    <div class="qa-panel qa-panel--dark">
      <div class="qa-row">
        <button id="focusMenuButton" type="button" class="mobile-menu-btn" style="display:inline-flex;">
          <span class="qa-menu-glyph" aria-hidden="true">≡</span>
        </button>
        <div id="langSwitcher" class="subpage-language-switch">
          <button id="focusLangButton" type="button" class="lang-switch-button" aria-label="Deutsch">
            <svg width="21" height="14" viewBox="0 0 21 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="21" height="14" fill="#000000"/>
              <rect y="4.66667" width="21" height="4.66667" fill="#DD0000"/>
              <rect y="9.33333" width="21" height="4.66667" fill="#FFCE00"/>
            </svg>
          </button>
          <button type="button" class="lang-switch-button" aria-label="English">
            <svg width="21" height="14" viewBox="0 0 21 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="21" height="14" fill="#0052B4"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="mobile-menu active qa-mobile-menu">
        <a id="focusMobileLink" href="#" class="mobile-nav-link">Kontakt</a>
        <a href="#" class="mobile-nav-link">Chronik</a>
      </div>
    </div>
  </div>

  <script>
    const targetId = new URLSearchParams(window.location.search).get('target');
    const target = targetId ? document.getElementById(targetId) : null;

    if (target) {
      window.addEventListener('load', function() {
        target.classList.add('qa-force-focus');
        target.focus();
        target.scrollIntoView({ block: 'center', inline: 'nearest' });
      });
    }
  </script>
</body>
</html>
