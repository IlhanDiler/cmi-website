# Please do not edit this file.
# Build steps can be customized in the cmi-website-build.yaml.
# More information under https://docs.ionos.space/docs/github-actions-customization/
# version: 2022-07-21

name: "Deploy Now: Orchestration"
run-name: "Deploy Now: Build cmi-website · ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message || format('Triggered by {0}', github.actor) }}"

on:
  workflow_run:
    workflows:
      - Site Quality Gate
    types:
      - completed
  workflow_dispatch:

jobs:
  retrieve-project:
    name: check readiness
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      deployment-enabled: ${{ fromJson(steps.project.outputs.info).deployment-enabled }}
      branch-id: ${{ fromJson(steps.project.outputs.info).branch-id }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch project data
        uses: ionos-deploy-now/project-action@v1
        id: project
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 7c7fa450-8959-44b2-9961-6a3820c74469
          action: retrieve-info


  build:
    name: build
    needs: retrieve-project
    if: ${{ needs.retrieve-project.result == 'success' && needs.retrieve-project.outputs.deployment-enabled == 'true' }}
    uses: ./.github/workflows/cmi-website-build.yaml
    with:
      site-url: https://IONOS_DEPLOY_NOW_SITE_URL
      branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
      source-sha: ${{ needs.retrieve-project.outputs.source-sha }}
    secrets: inherit

  deploy:
    name: trigger deployment
    needs:
      - retrieve-project
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment(s)
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 7c7fa450-8959-44b2-9961-6a3820c74469
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          action: dispatch-deployments
