name: "Private Docs Preview"
run-name: "Private Docs Preview · ${{ github.ref_name || github.sha }}"

on:
  workflow_dispatch:
  push:
    paths:
      - docs/**
      - scripts/build_private_docs_preview.py
      - .github/workflows/private-docs-preview.yaml
  pull_request:
    paths:
      - docs/**
      - scripts/build_private_docs_preview.py
      - .github/workflows/private-docs-preview.yaml

permissions:
  contents: read

concurrency:
  group: private-docs-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-private-docs-preview:
    name: build private docs preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Markdown renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown

      - name: Build docs preview artifact
        run: python scripts/build_private_docs_preview.py

      - name: Upload private docs preview
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: private-docs-preview-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            tmp/private-docs-preview/**

      - name: Add run summary
        run: |
          echo "## Private Docs Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: ${{ steps.upload.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Nur mit Repository-Zugriff erreichbar. Nicht auf Staging deployed." >> "$GITHUB_STEP_SUMMARY"